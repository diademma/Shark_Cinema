<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shark Cinema 🦈</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            background: #0b0713; color: #e2dbf8; 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; 
            display: flex; flex-direction: column; align-items: center; 
            min-height: 100vh; padding: 20px 15px; padding-bottom: 80px; 
        }

        .error-toast { 
            position: fixed; top: 10px; left: 50%; transform: translateX(-50%); 
            width: 90%; max-width: 800px; background: #ff4757; color: white; 
            padding: 14px 20px; border-radius: 14px; font-size: 13px; font-family: monospace; 
            box-shadow: 0 10px 30px rgba(255, 71, 87, 0.5); z-index: 9999; display: none; 
            word-break: break-all; border: 1px solid #ff6b81;
        }

        .modal-overlay { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(11, 7, 19, 0.95); backdrop-filter: blur(12px); 
            display: flex; justify-content: center; align-items: center; z-index: 1000; 
        }
        .modal-box { 
            background: #171026; border: 1px solid #332252; padding: 30px 25px; 
            border-radius: 24px; text-align: center; width: 90%; max-width: 380px; 
            box-shadow: 0 15px 35px rgba(123, 44, 191, 0.2); 
        }
        .modal-box h2 { margin-bottom: 10px; font-size: 24px; color: #c77dff; }
        .modal-box p { font-size: 14px; color: #9d8ec4; margin-bottom: 22px; }
        .pin-input { 
            width: 100%; padding: 14px; border-radius: 14px; border: 1px solid #3d2b63; 
            background: #0f0a1c; color: #e2dbf8; font-size: 20px; text-align: center; 
            letter-spacing: 6px; margin-bottom: 15px; outline: none; 
        }
        .btn { padding: 12px 20px; border-radius: 12px; border: none; font-weight: bold; font-size: 14px; cursor: pointer; transition: all 0.2s ease; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
        .btn:hover { opacity: 0.9; transform: translateY(-1px); }
        .btn-owner { background: linear-gradient(135deg, #7b2cbf, #9d4edd); color: white; width: 100%; margin-bottom: 12px; }
        .btn-guest { background: transparent; color: #9d8ec4; border: 1px solid #332252; width: 100%; }
        
        /* Единый стиль кнопок управления */
        .btn-action { 
            background: #231738; color: #e2dbf8; border: 1px solid #3d2b63; 
            flex: 1; min-width: 180px; padding: 13px 18px;
        }
        .btn-action:hover { border-color: #9d4edd; color: white; }
        .btn-magic { background: linear-gradient(135deg, #7b2cbf, #9d4edd); color: white; border: none; }
        .btn-sync { background: linear-gradient(135deg, #2ed573, #10ac84); color: white; border: none; display: none; }

        /* Центрированный Элитный Заголовок */
        .header-container { 
            width: 100%; max-width: 950px; display: flex; flex-direction: column; 
            align-items: center; justify-content: center; gap: 12px; margin-bottom: 20px; 
            background: rgba(23, 16, 38, 0.6); border: 1px solid #332252; 
            backdrop-filter: blur(12px); padding: 18px 24px; border-radius: 20px; 
            box-shadow: 0 10px 30px rgba(123, 44, 191, 0.15); 
        }
        .logo-title { 
            font-size: 28px; font-weight: 800; letter-spacing: 1px;
            background: linear-gradient(135deg, #ffffff 0%, #c77dff 50%, #9d4edd 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .status-group { display: flex; gap: 10px; align-items: center; }
        .badge { padding: 6px 16px; border-radius: 20px; font-size: 12px; font-weight: bold; display: inline-flex; align-items: center; gap: 6px; }
        .badge-owner { background: rgba(157, 78, 221, 0.2); color: #c77dff; border: 1px solid #9d4edd; }
        .badge-guest { background: rgba(114, 9, 183, 0.2); color: #b5179e; border: 1px solid #7209b7; }
        .badge-online { background: rgba(46, 213, 115, 0.15); color: #2ed573; border: 1px solid rgba(46, 213, 115, 0.4); }
        .badge-offline { background: rgba(255, 71, 87, 0.15); color: #ff4757; border: 1px solid rgba(255, 71, 87, 0.4); }

        .owner-panel { 
            width: 100%; max-width: 950px; background: #171026; 
            border: 1px solid #332252; padding: 18px; border-radius: 20px; 
            margin-bottom: 20px; display: none; box-shadow: 0 8px 25px rgba(0,0,0,0.3);
        }
        .controls-row { display: flex; gap: 10px; margin-top: 12px; flex-wrap: wrap; }
        .url-input { 
            flex: 1; padding: 13px 18px; border-radius: 12px; 
            border: 1px solid #3d2b63; background: #0f0a1c; color: white; 
            font-size: 14px; outline: none; min-width: 250px; transition: 0.2s;
        }
        .url-input:focus { border-color: #9d4edd; box-shadow: 0 0 15px rgba(157, 78, 221, 0.3); }

        .series-panel {
            width: 100%; max-width: 950px; background: #171026;
            border: 1px solid #332252; padding: 18px; border-radius: 20px;
            margin-bottom: 20px; display: none; box-shadow: 0 8px 25px rgba(0,0,0,0.3);
        }
        .series-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 12px; flex-wrap: wrap; gap: 10px;
        }
        .media-title-box { display: flex; align-items: center; gap: 8px; font-weight: bold; }
        .title-label { color: #9d8ec4; font-size: 13px; }
        .title-text { color: #c77dff; font-size: 16px; font-weight: 800; }
        
        .series-grid {
            display: flex; gap: 10px; overflow-x: auto; overflow-y: hidden;
            padding: 6px 2px; white-space: nowrap; -webkit-overflow-scrolling: touch;
        }
        .series-grid::-webkit-scrollbar { height: 6px; }
        .series-grid::-webkit-scrollbar-thumb { background: #3d2b63; border-radius: 10px; }
        
        .btn-ep {
            flex: 0 0 auto; padding: 10px 16px; background: #0f0a1c; border: 1px solid #3d2b63;
            color: #e2dbf8; border-radius: 12px; cursor: pointer; font-size: 13px; font-weight: bold;
            transition: 0.2s;
        }
        .btn-ep:hover { border-color: #9d4edd; color: #c77dff; }
        .btn-ep.active { background: linear-gradient(135deg, #7b2cbf, #9d4edd); color: white; border: none; }
        .btn-nav-ep {
            padding: 8px 16px; background: #332252; color: white; border: none;
            border-radius: 10px; cursor: pointer; font-weight: bold; font-size: 13px;
        }

        .player-container { 
            width: 100%; max-width: 950px; height: 600px; 
            position: relative; background: #000; border-radius: 24px; 
            overflow: hidden; border: 1px solid #2e1f47; 
            box-shadow: 0 12px 40px rgba(123, 44, 191, 0.25); 
        }
        iframe { width: 100%; height: 100%; border: none; }
        video { width: 100%; height: 100%; background: #000; display: none; outline: none; }
        
        .guest-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 100; display: none; background: transparent; }

        /* Векторные фиолетовые кнопки плавающего контроля */
        .floating-player-controls {
            position: absolute; top: 15px; right: 15px; z-index: 300; display: flex; gap: 8px;
        }
        .btn-floating {
            background: linear-gradient(135deg, rgba(123, 44, 191, 0.85), rgba(157, 78, 221, 0.85));
            color: white; border: 1px solid rgba(199, 125, 255, 0.4); padding: 8px 16px;
            border-radius: 20px; font-size: 12px; font-weight: bold; cursor: pointer;
            backdrop-filter: blur(8px); box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
            transition: all 0.2s ease; display: none; align-items: center; gap: 6px;
        }
        .btn-floating:hover {
            transform: translateY(-2px); box-shadow: 0 6px 20px rgba(157, 78, 221, 0.6);
            background: linear-gradient(135deg, #7b2cbf, #9d4edd);
        }

        .countdown-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(11, 7, 19, 0.85); backdrop-filter: blur(8px);
            display: none; justify-content: center; align-items: center;
            z-index: 500; flex-direction: column;
        }
        .countdown-num {
            font-size: 150px; font-weight: bold; color: #c77dff;
            text-shadow: 0 0 40px #9d4edd; animation: pulse 1s infinite;
        }
        .countdown-text { font-size: 20px; color: #e2dbf8; margin-top: 10px; font-weight: bold; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.15); } 100% { transform: scale(1); } }

        .log-console-bar {
            position: fixed; bottom: 0; left: 0; width: 100%; background: #120e24; 
            border-top: 1px solid #332252; z-index: 8000; font-family: monospace; font-size: 11px;
            display: none; /* Скрыто по умолчанию для Зрителей */
        }
        .log-header {
            padding: 10px 15px; background: #1a1433; display: flex; justify-content: space-between; 
            align-items: center; cursor: pointer; color: #c77dff; font-weight: bold;
        }
        .log-content { max-height: 150px; overflow-y: auto; padding: 10px 15px; display: none; background: #0a0714; }
        .log-line { margin-bottom: 4px; border-bottom: 1px solid #1a1433; padding-bottom: 2px; word-break: break-all; }
        .log-info { color: #4895ef; }
        .log-success { color: #2ed573; }
        .log-warn { color: #ffa502; }
        .log-error { color: #ff4757; font-weight: bold; }

        @media (max-width: 600px) { .player-container { height: 400px; } .countdown-num { font-size: 100px; } }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js?v=6.0.0"></script>
</head>
<body>

    <div class="error-toast" id="errorToast" onclick="this.style.display='none'"></div>

    <div class="modal-overlay" id="authModal">
        <div class="modal-box">
            <h2>Shark Cinema 🦈</h2>
            <p>Введи ПИН Овнера или войди как зритель</p>
            <input type="password" id="pinInput" class="pin-input" maxlength="8" placeholder="••••••••" inputmode="numeric">
            <button class="btn btn-owner" id="loginBtn" onclick="loginOwner()">Войти как Owner</button>
            <button class="btn btn-guest" onclick="loginGuest()">Я Зритель</button>
        </div>
    </div>

    <!-- Центрированный Элитный Заголовок -->
    <div class="header-container">
        <div class="logo-title">Shark Cinema 🦈</div>
        <div class="status-group">
            <span id="serverBadge" class="badge badge-offline">🔴 Подключение...</span>
            <span id="roleBadge" class="badge badge-guest">Зритель</span>
        </div>
    </div>

    <div class="owner-panel" id="ownerPanel">
        <div style="display: flex; gap: 10px; width: 100%; flex-wrap: wrap;">
            <input type="text" id="targetUrl" class="url-input" placeholder="Ссылка Kinovibe (Фильм, Сериал или Аниме)">
        </div>
        <div class="controls-row">
            <button class="btn btn-action" onclick="loadIframe()">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
                Открыть сайт
            </button>
            <button class="btn btn-action btn-magic" onclick="extractVideo()">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polygon points="5 3 19 12 5 21 5 3"/></svg>
                Открыть в Плеере (SyncPlay)
            </button>
            <button class="btn btn-action btn-sync" id="syncStartBtn" onclick="startSyncCountdown()">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                Синхронный Старт
            </button>
        </div>

        <!-- Авторизация Kinovibe (Скрывается если уже подключено) -->
        <div id="kvAuthBox" style="margin-top: 15px; border-top: 1px solid #332252; padding-top: 12px;">
            <small style="color: #9d8ec4; display: block; margin-bottom: 8px;">🔑 Подключение аккаунта Kinovibe (для разблокировки HD):</small>
            <div style="display: flex; gap: 10px; flex-wrap: wrap;">
                <input type="text" id="kvLogin" class="url-input" placeholder="Логин Kinovibe">
                <input type="password" id="kvPass" class="url-input" placeholder="Пароль Kinovibe">
                <button class="btn btn-action btn-magic" style="flex:0; min-width: 160px;" onclick="connectKinovibeHD()">Подключить HD</button>
            </div>
        </div>
    </div>

    <div class="series-panel" id="seriesPanel">
        <div class="series-header">
            <div class="media-title-box">
                <span class="title-label">Сейчас идет:</span>
                <span class="title-text" id="mediaTitleText">Загрузка...</span>
            </div>
            <div style="display: flex; gap: 8px;">
                <button class="btn-nav-ep" id="prevEpBtn" onclick="switchEpRelative(-1)">◀ Пред.</button>
                <button class="btn-nav-ep" id="nextEpBtn" onclick="switchEpRelative(1)">След. ▶</button>
            </div>
        </div>
        <div class="series-grid" id="seriesGrid"></div>
    </div>

    <div class="player-container">
        <div class="guest-overlay" id="guestOverlay"></div>

        <!-- Векторные плавающие кнопки -->
        <div class="floating-player-controls">
            <button class="btn-floating" id="pipBtn" onclick="togglePiP()">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="2" y="3" width="20" height="14" rx="2"/><rect x="11" y="9" width="9" height="6" rx="1"/></svg>
                Плавающий режим
            </button>
            <button class="btn-floating" id="fsBtn" onclick="toggleFullscreen()">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
                На весь экран
            </button>
        </div>
        
        <div class="countdown-overlay" id="countdownOverlay">
            <div class="countdown-num" id="countdownNum">5</div>
            <div class="countdown-text">Подготовка синхронного потока...</div>
        </div>

        <iframe id="mainIframe" src="https://kinovibe.cc/" allowfullscreen></iframe>
        <video id="mainVideo" controls playsinline></video>
    </div>

    <!-- Консоль логов (Видна ТОЛЬКО Овнеру) -->
    <div class="log-console-bar">
        <div class="log-header" onclick="toggleLogs()">
            <span>🐞 Живой Лог Ошибок <span id="logCount">(0)</span></span>
            <span id="toggleText">▲ Показать логи</span>
        </div>
        <div class="log-content" id="logContent"></div>
    </div>

    <script>
        const VERSION = "6.0.0";
        const SERVER_URL = "https://agile-enrich-grumpily.ngrok-free.dev";
        let logCounter = 0;

        function addLog(type, msg, details = '') {
            logCounter++;
            document.getElementById('logCount').innerText = `(${logCounter})`;
            const consoleBox = document.getElementById('logContent');
            const time = new Date().toLocaleTimeString();
            const line = document.createElement('div');
            line.className = `log-line log-${type.toLowerCase()}`;
            line.innerHTML = `<span>[${time}] [${type}]</span> ${msg} <small style="color:#777">${details}</small>`;
            consoleBox.appendChild(line);
            consoleBox.scrollTop = consoleBox.scrollHeight;
            if (type === 'ERROR') showRawError(`[${type}] ${msg} ${details}`);
        }

        function showRawError(text) {
            const toast = document.getElementById('errorToast');
            toast.innerText = text;
            toast.style.display = 'block';
        }

        function toggleLogs() {
            const content = document.getElementById('logContent');
            content.style.display = content.style.display === 'block' ? 'none' : 'block';
            document.getElementById('toggleText').innerText = content.style.display === 'block' ? '▼ Скрыть логи' : '▲ Показать логи';
        }

        const socket = io(SERVER_URL, {
            transports: ['websocket'],
            query: { v: VERSION },
            extraHeaders: { "ngrok-skip-browser-warning": "true" }
        });

        const iframe = document.getElementById('mainIframe');
        const video = document.getElementById('mainVideo');
        const guestOverlay = document.getElementById('guestOverlay');
        let isOwner = false;
        let hlsPlayer = null;
        let ignoreNextEvent = false;
        let currentPlaylist = [];
        let currentEpIndex = 0;

        async function togglePiP() {
            try {
                if (document.pictureInPictureElement) {
                    await document.exitPictureInPicture();
                } else if (video.requestPictureInPicture) {
                    await video.requestPictureInPicture();
                } else if (video.webkitSetPresentationMode) {
                    video.webkitSetPresentationMode(video.webkitPresentationMode === 'picture-in-picture' ? 'inline' : 'picture-in-picture');
                } else {
                    alert('Режим Окошка (PiP) не поддерживается браузером');
                }
            } catch (e) {
                addLog('ERROR', 'Ошибка включения Окошка (PiP)', e.message);
            }
        }

        function toggleFullscreen() {
            const container = document.querySelector('.player-container');
            if (!document.fullscreenElement && !document.webkitFullscreenElement) {
                if (container.requestFullscreen) {
                    container.requestFullscreen();
                } else if (container.webkitRequestFullscreen) {
                    container.webkitRequestFullscreen();
                } else if (video.webkitEnterFullscreen) {
                    video.webkitEnterFullscreen();
                }
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                } else if (document.webkitExitFullscreen) {
                    document.webkitExitFullscreen();
                }
            }
        }

        let lastTapTime = 0;
        function handleDoubleTap(e) {
            const now = new Date().getTime();
            const timespan = now - lastTapTime;
            if (timespan < 300 && timespan > 0) {
                toggleFullscreen();
                if (e.cancelable) e.preventDefault();
            }
            lastTapTime = now;
        }

        guestOverlay.addEventListener('touchend', handleDoubleTap);
        guestOverlay.addEventListener('dblclick', toggleFullscreen);

        socket.on('connect', () => {
            addLog('SUCCESS', 'WebSocket ПОДКЛЮЧЕН!');
            const badge = document.getElementById('serverBadge');
            badge.className = 'badge badge-online';
            badge.innerText = '💚 На связи'; // 💚 Зеленое сердечко вместо кругляшки!
        });

        socket.on('auth_result', (data) => {
            if (data.success) {
                isOwner = true;
                addLog('SUCCESS', 'Овнер авторизован!');
                document.getElementById('authModal').style.display = 'none';
                document.getElementById('ownerPanel').style.display = 'block';
                document.getElementById('roleBadge').className = 'badge badge-owner';
                document.getElementById('roleBadge').innerText = 'Owner 👑';
                
                // Показываем логи ТОЛЬКО Овнеру
                document.querySelector('.log-console-bar').style.display = 'block';
            }
        });

        socket.on('server_log', (data) => { addLog(data.type, data.msg, data.details); });

        socket.on('kinovibe_auth_result', (data) => {
            if (data.success) {
                document.getElementById('kvAuthBox').style.display = 'none'; // Скрываем форму если залогинен
                addLog('SUCCESS', 'Kinovibe HD Аккаунт подсоединен!');
            } else {
                addLog('ERROR', 'Ошибка входа Kinovibe!', data.msg);
            }
        });

        socket.on('room_state', (state) => {
            addLog('INFO', 'Состояние комнаты:', state.mode);
            
            // Если аккаунт Kinovibe подключен — скрываем окно входа
            if (state.has_kv_cookies) {
                document.getElementById('kvAuthBox').style.display = 'none';
            }
            if (state.playlist && state.playlist.length > 0) {
                renderPlaylist(state.playlist, state.current_ep_index || 0, state.media_title || "");
            }
            if (state.mode === 'iframe' && iframe.src !== state.current_url) {
                iframe.src = state.current_url;
                switchToIframe();
            } else if (state.mode === 'video' && state.current_url) {
                loadRawVideo(state.current_url, false);
                if (!isOwner) {
                    addLog('INFO', 'Синхронизация времени с Овнером...');
                    socket.emit('guest_ready_sync');
                }
            }
        });

        function connectKinovibeHD() {
            const login = document.getElementById('kvLogin').value.trim();
            const password = document.getElementById('kvPass').value.trim();
            if (!login || !password) return alert('Введи логин и пароль Kinovibe!');
            addLog('INFO', 'Отправка данных авторизации Kinovibe на сервер...');
            socket.emit('kinovibe_login', { login: login, password: password });
        }

        function switchToIframe() {
            video.style.display = 'none';
            iframe.style.display = 'block';
            document.getElementById('pipBtn').style.display = 'none';
            document.getElementById('fsBtn').style.display = 'none';
            if (hlsPlayer) hlsPlayer.destroy();
            video.pause();
            document.getElementById('syncStartBtn').style.display = 'none';
        }

        function loadRawVideo(rawUrl, autoStartBtn = true) {
            addLog('SUCCESS', 'Запуск прямого потока:', rawUrl);
            iframe.style.display = 'none';
            video.style.display = 'block';
            
            document.getElementById('pipBtn').style.display = 'inline-flex';
            document.getElementById('fsBtn').style.display = 'inline-flex';

            video.pause();
            video.currentTime = 0;
            
            if (isOwner && autoStartBtn) {
                document.getElementById('syncStartBtn').style.display = 'inline-flex';
            }
            
            if (Hls.isSupported() && rawUrl.includes('.m3u8')) {
                if (hlsPlayer) hlsPlayer.destroy();
                hlsPlayer = new Hls();
                hlsPlayer.loadSource(rawUrl);
                hlsPlayer.attachMedia(video);
            } else {
                video.src = rawUrl;
            }
        }

        socket.on('request_owner_time', (data) => {
            if (isOwner) {
                socket.emit('owner_time_response', {
                    guest_sid: data.guest_sid,
                    time: video.currentTime,
                    paused: video.paused
                });
            }
        });

        socket.on('apply_sync_late', (data) => {
            if (!isOwner) {
                ignoreNextEvent = true;
                const targetTime = data.time + (data.paused ? 0 : 1.0);
                video.currentTime = targetTime;
                
                if (!data.paused) {
                    video.play().catch(e => addLog('ERROR', 'Автоплей блочит браузер. Нажми на экран.'));
                } else {
                    video.pause();
                }
                addLog('SUCCESS', 'Синхронизация завершена!', `Время: ${targetTime.toFixed(1)}с`);
            }
        });

        function startSyncCountdown() {
            if (!isOwner) return;
            document.getElementById('syncStartBtn').style.display = 'none';
            socket.emit('trigger_countdown');
        }

        socket.on('start_countdown', () => {
            const overlay = document.getElementById('countdownOverlay');
            const num = document.getElementById('countdownNum');
            overlay.style.display = 'flex';
            
            let count = 5;
            num.innerText = count;
            
            ignoreNextEvent = true;
            video.currentTime = 0;
            video.pause();

            const iv = setInterval(() => {
                count--;
                if (count > 0) {
                    num.innerText = count;
                } else {
                    clearInterval(iv);
                    overlay.style.display = 'none';
                    ignoreNextEvent = true;
                    video.play().catch(e => addLog('ERROR', 'Автоплей блочит браузер. Нажми на экран.'));
                }
            }, 1000);
        });

        socket.on('player_command', (data) => {
            if (data.action === 'load_iframe') {
                iframe.src = data.url;
                switchToIframe();
            }
            if (data.action === 'load_video') {
                loadRawVideo(data.url, true);
            }
            if (data.action === 'update_playlist') {
                renderPlaylist(data.playlist, data.currentIndex, data.media_title || "");
            }
            
            if (isOwner) return;
            
            if (data.action === 'play') {
                ignoreNextEvent = true;
                if (Math.abs(video.currentTime - data.time) > 2.0) video.currentTime = data.time;
                video.play().catch(e => console.log(e));
            }
            if (data.action === 'pause') {
                ignoreNextEvent = true;
                video.pause();
                video.currentTime = data.time;
                addLog('INFO', 'Заморозка от Овнера', `Время: ${data.time}`);
            }
            if (data.action === 'seek') {
                ignoreNextEvent = true;
                video.currentTime = data.time;
            }
        });

        video.addEventListener('play', () => {
            if (isOwner && !ignoreNextEvent) socket.emit('player_action', { action: 'play', time: video.currentTime });
            ignoreNextEvent = false;
        });
        video.addEventListener('pause', () => {
            if (isOwner && !ignoreNextEvent) socket.emit('player_action', { action: 'pause', time: video.currentTime });
            ignoreNextEvent = false;
        });
        video.addEventListener('seeked', () => {
            if (isOwner && !ignoreNextEvent) socket.emit('player_action', { action: 'seek', time: video.currentTime });
            ignoreNextEvent = false;
        });

        function loginOwner() {
            const pin = document.getElementById('pinInput').value.trim();
            socket.emit('auth_owner', { pin: pin });
        }

        function loginGuest() {
            document.getElementById('authModal').style.display = 'none';
            document.getElementById('guestOverlay').style.display = 'block';
            addLog('INFO', 'Вход зрителя.');
        }

        // Отрисовка заглавного названия фильма/сериала
        function renderPlaylist(playlist, activeIndex = 0, mediaTitle = "") {
            currentPlaylist = playlist;
            currentEpIndex = activeIndex;
            
            const panel = document.getElementById('seriesPanel');
            const grid = document.getElementById('seriesGrid');
            const titleEl = document.getElementById('mediaTitleText');
            
            panel.style.display = 'block';
            grid.innerHTML = '';
            
            const activeEpName = playlist[activeIndex] ? playlist[activeIndex].title : "";
            const displayTitle = mediaTitle ? `${mediaTitle} • ${activeEpName}` : activeEpName;
            titleEl.innerText = displayTitle;

            playlist.forEach((ep, idx) => {
                const btn = document.createElement('button');
                btn.className = `btn-ep ${idx === activeIndex ? 'active' : ''}`;
                btn.innerText = ep.title;
                btn.onclick = () => {
                    if (!isOwner) return alert('Только Овнер!');
                    document.getElementById('syncStartBtn').style.display = 'none';
                    socket.emit('switch_episode', { index: idx });
                };
                grid.appendChild(btn);
            });
        }

        function switchEpRelative(dir) {
            if (!isOwner) return;
            const newIndex = currentEpIndex + dir;
            if (newIndex >= 0 && newIndex < currentPlaylist.length) {
                document.getElementById('syncStartBtn').style.display = 'none';
                socket.emit('switch_episode', { index: newIndex });
            }
        }

        function loadIframe() {
            const url = document.getElementById('targetUrl').value.trim();
            if (!url) return alert('Вставь ссылку!');
            iframe.src = url;
            switchToIframe();
            socket.emit('player_action', { action: 'load_iframe', url: url });
        }

        function extractVideo() {
            const url = document.getElementById('targetUrl').value.trim();
            if (!url) return alert('Вставь ссылку!');
            document.getElementById('syncStartBtn').style.display = 'none';
            addLog('INFO', 'Запуск v6.0 Visual Polish...', url);
            socket.emit('extract_magic', { url: url });
        }
    </script>
</body>
</html>
