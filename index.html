<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shark Cinema 🦈</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        /* Фиолетовая темная палитра */
        body { 
            background: #0b0713; 
            color: #e2dbf8; 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            min-height: 100vh; 
            padding: 15px; 
        }
        
        /* Всплывающее окно авторизации */
        .modal-overlay { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(11, 7, 19, 0.9); 
            backdrop-filter: blur(12px); 
            display: flex; justify-content: center; align-items: center; 
            z-index: 1000; 
        }
        .modal-box { 
            background: #171026; 
            border: 1px solid #332252; 
            padding: 30px 25px; 
            border-radius: 24px; 
            text-align: center; 
            width: 90%; max-width: 380px; 
            box-shadow: 0 15px 35px rgba(123, 44, 191, 0.2); 
        }
        .modal-box h2 { margin-bottom: 10px; font-size: 24px; color: #c77dff; }
        .modal-box p { font-size: 14px; color: #9d8ec4; margin-bottom: 22px; }
        
        .pin-input { 
            width: 100%; padding: 14px; border-radius: 14px; 
            border: 1px solid #3d2b63; background: #0f0a1c; 
            color: #e2dbf8; font-size: 20px; text-align: center; 
            letter-spacing: 6px; margin-bottom: 15px; outline: none; 
            transition: 0.3s;
        }
        .pin-input:focus { border-color: #9d4edd; box-shadow: 0 0 15px rgba(157, 78, 221, 0.4); }

        .btn { 
            width: 100%; padding: 14px; border-radius: 14px; border: none; 
            font-weight: bold; font-size: 15px; cursor: pointer; transition: 0.2s; 
        }
        .btn-owner { 
            background: linear-gradient(135deg, #7b2cbf, #9d4edd); 
            color: white; margin-bottom: 12px; 
            box-shadow: 0 4px 15px rgba(123, 44, 191, 0.4);
        }
        .btn-guest { 
            background: transparent; color: #9d8ec4; 
            border: 1px solid #332252; 
        }
        .btn:active { transform: scale(0.98); }

        /* Шапка и статус */
        .header { width: 100%; max-width: 800px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .header h2 { font-size: 22px; color: #e2dbf8; text-shadow: 0 0 10px rgba(199, 125, 255, 0.3); }
        
        .badge { padding: 6px 14px; border-radius: 20px; font-size: 12px; font-weight: bold; }
        .badge-owner { background: rgba(157, 78, 221, 0.2); color: #c77dff; border: 1px solid #9d4edd; }
        .badge-guest { background: rgba(114, 9, 183, 0.2); color: #b5179e; border: 1px solid #7209b7; }

        /* Панель Овнера */
        .owner-panel { 
            width: 100%; max-width: 800px; background: #171026; 
            border: 1px solid #332252; padding: 18px; border-radius: 18px; 
            margin-bottom: 20px; display: none; 
            box-shadow: 0 8px 25px rgba(0,0,0,0.3);
        }
        .url-input-group { display: flex; gap: 10px; }
        .url-input { 
            flex: 1; padding: 12px 16px; border-radius: 12px; 
            border: 1px solid #3d2b63; background: #0f0a1c; color: white; 
            font-size: 14px; outline: none; 
        }
        .url-input:focus { border-color: #9d4edd; }

        /* Плеер */
        .player-container { 
            width: 100%; max-width: 800px; position: relative; 
            background: #000; border-radius: 20px; overflow: hidden; 
            border: 1px solid #2e1f47;
            box-shadow: 0 12px 40px rgba(123, 44, 191, 0.25); 
        }
        video { width: 100%; display: block; }
        .guest-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 80%; z-index: 10; display: none; }
    </style>
</head>
<body>

    <!-- Окно Авторизации -->
    <div class="modal-overlay" id="authModal">
        <div class="modal-box">
            <h2>Shark Cinema 🦈</h2>
            <p>Введи 8-значный ПИН Овнера или войди как зритель</p>
            <input type="password" id="pinInput" class="pin-input" maxlength="8" placeholder="••••••••" inputmode="numeric">
            <button class="btn btn-owner" onclick="loginOwner()">Войти как Owner</button>
            <button class="btn btn-guest" onclick="loginGuest()">Пропустить (Я Зритель)</button>
        </div>
    </div>

    <!-- Шапка сайта -->
    <div class="header">
        <h2>Shark Cinema</h2>
        <span id="roleBadge" class="badge badge-guest">Режим: Зритель</span>
    </div>

    <!-- Панель управления для Овнера -->
    <div class="owner-panel" id="ownerPanel">
        <div class="url-input-group">
            <input type="text" id="kinovibeUrl" class="url-input" placeholder="Вставь ссылку на фильм с Kinovibe...">
            <button class="btn btn-owner" style="width: auto; padding: 0 22px; margin-bottom: 0;" onclick="loadMovie()">Загрузить</button>
        </div>
    </div>

    <!-- Плеер -->
    <div class="player-container">
        <div class="guest-overlay" id="guestOverlay"></div>
        <video id="mainPlayer" controls playsinline poster="https://vjs.zencdn.net/v/oceans.png">
            <source src="https://vjs.zencdn.net/v/oceans.mp4" type="video/mp4">
        </video>
    </div>

    <script>
        // Это заполнитель для секрета. Когда подключим GitHub Action или Python, подставим сюда.
        const OWNER_PIN = "__OWNER_PIN__"; 

        function loginOwner() {
            const pin = document.getElementById('pinInput').value;
            
            // Если секрет еще не настроен в GitHub, по умолчанию ПИН = 12345678
            const validPin = (OWNER_PIN === "__OWNER_PIN__") ? "12345678" : OWNER_PIN;

            if (pin === validPin) {
                document.getElementById('authModal').style.display = 'none';
                document.getElementById('ownerPanel').style.display = 'block';
                document.getElementById('roleBadge').className = 'badge badge-owner';
                document.getElementById('roleBadge').innerText = 'Режим: Owner 👑';
            } else {
                alert('Неверный 8-значный ПИН!');
            }
        }

        function loginGuest() {
            document.getElementById('authModal').style.display = 'none';
            document.getElementById('roleBadge').className = 'badge badge-guest';
            document.getElementById('roleBadge').innerText = 'Режим: Зритель 👁️';
            document.getElementById('guestOverlay').style.display = 'block';
        }

        function loadMovie() {
            const url = document.getElementById('kinovibeUrl').value;
            if (!url) return alert('Вставь ссылку!');
            alert('Ссылка принята: ' + url);
        }
    </script>
</body>
</html>
