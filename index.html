<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shark Cinema 🦈 v2.5</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            background: #0b0713; color: #e2dbf8; 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; 
            display: flex; flex-direction: column; align-items: center; 
            min-height: 100vh; padding: 15px; padding-bottom: 80px; 
        }

        .error-toast { 
            position: fixed; top: 10px; left: 50%; transform: translateX(-50%); 
            width: 90%; max-width: 800px; background: #ff4757; color: white; 
            padding: 14px 20px; border-radius: 14px; font-size: 13px; font-family: monospace; 
            box-shadow: 0 10px 30px rgba(255, 71, 87, 0.5); z-index: 9999; display: none; 
            word-break: break-all; border: 1px solid #ff6b81;
        }

        .modal-overlay { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(11, 7, 19, 0.95); backdrop-filter: blur(12px); 
            display: flex; justify-content: center; align-items: center; z-index: 1000; 
        }
        .modal-box { 
            background: #171026; border: 1px solid #332252; padding: 30px 25px; 
            border-radius: 24px; text-align: center; width: 90%; max-width: 380px; 
            box-shadow: 0 15px 35px rgba(123, 44, 191, 0.2); 
        }
        .modal-box h2 { margin-bottom: 10px; font-size: 24px; color: #c77dff; }
        .modal-box p { font-size: 14px; color: #9d8ec4; margin-bottom: 22px; }
        .pin-input { 
            width: 100%; padding: 14px; border-radius: 14px; border: 1px solid #3d2b63; 
            background: #0f0a1c; color: #e2dbf8; font-size: 20px; text-align: center; 
            letter-spacing: 6px; margin-bottom: 15px; outline: none; 
        }
        .btn { width: 100%; padding: 14px; border-radius: 14px; border: none; font-weight: bold; font-size: 15px; cursor: pointer; transition: 0.2s; }
        .btn-owner { background: linear-gradient(135deg, #7b2cbf, #9d4edd); color: white; margin-bottom: 12px; }
        .btn-guest { background: transparent; color: #9d8ec4; border: 1px solid #332252; }
        .btn:active { transform: scale(0.98); }

        /* Плавающая кнопка Синхронизации внизу справа */
        .floating-btn {
            position: fixed; bottom: 70px; right: 20px; z-index: 500;
            background: linear-gradient(135deg, #7b2cbf, #9d4edd);
            color: white; padding: 14px 22px; border-radius: 30px;
            font-weight: bold; font-size: 14px; border: none;
            box-shadow: 0 8px 25px rgba(157, 78, 221, 0.5);
            cursor: pointer; display: none;
        }

        .header { width: 100%; max-width: 950px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; flex-wrap: wrap; gap: 10px; }
        .header h2 { font-size: 22px; color: #e2dbf8; }
        .status-group { display: flex; gap: 8px; align-items: center; }
        .badge { padding: 6px 14px; border-radius: 20px; font-size: 12px; font-weight: bold; }
        .badge-owner { background: rgba(157, 78, 221, 0.2); color: #c77dff; border: 1px solid #9d4edd; }
        .badge-guest { background: rgba(114, 9, 183, 0.2); color: #b5179e; border: 1px solid #7209b7; }
        .badge-online { background: rgba(46, 213, 115, 0.2); color: #2ed573; border: 1px solid #2ed573; }
        .badge-offline { background: rgba(255, 71, 87, 0.2); color: #ff4757; border: 1px solid #ff4757; }

        .view-mode { width: 100%; max-width: 950px; }
        
        /* РЕЖИМ 1: Каталог Киновайба */
        .catalog-container { height: 600px; position: relative; background: #000; border-radius: 20px; overflow: hidden; border: 1px solid #2e1f47; }
        iframe { width: 100%; height: 100%; border: none; }
        .guest-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 100; display: none; background: transparent; }

        /* РЕЖИМ 2: Чистый Кинотеатр */
        .cinema-container { display: none; position: relative; background: #000; border-radius: 20px; overflow: hidden; border: 1px solid #2e1f47; }
        video { width: 100%; display: block; }
        .countdown-overlay { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(11, 7, 19, 0.9); z-index: 200; display: none; 
            flex-direction: column; justify-content: center; align-items: center; 
        }
        .countdown-number { font-size: 80px; font-weight: bold; color: #c77dff; text-shadow: 0 0 20px rgba(199, 125, 255, 0.6); }

        /* Панель переключения серий */
        .episodes-bar { display: flex; gap: 8px; overflow-x: auto; padding: 12px 0; margin-top: 10px; }
        .ep-btn { padding: 8px 16px; border-radius: 10px; background: #171026; border: 1px solid #332252; color: #c77dff; font-weight: bold; cursor: pointer; white-space: nowrap; }
        .ep-btn.active { background: #9d4edd; color: white; border-color: #c77dff; }

        .cinema-tools { margin-top: 15px; display: flex; justify-content: space-between; align-items: center; }

        .log-console-bar { position: fixed; bottom: 0; left: 0; width: 100%; background: #120e24; border-top: 1px solid #332252; z-index: 8000; font-family: monospace; font-size: 11px; }
        .log-header { padding: 10px 15px; background: #1a1433; display: flex; justify-content: space-between; align-items: center; cursor: pointer; color: #c77dff; font-weight: bold; }
        .log-content { max-height: 150px; overflow-y: auto; padding: 10px 15px; display: none; background: #0a0714; }
        .log-line { margin-bottom: 4px; border-bottom: 1px solid #1a1433; padding-bottom: 2px; word-break: break-all; }
        .log-info { color: #4895ef; }
        .log-success { color: #2ed573; }
        .log-warn { color: #ffa502; }
        .log-error { color: #ff4757; font-weight: bold; }

        @media (max-width: 600px) { .catalog-container { height: 400px; } }
    </style>
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js?v=2.5.0"></script>
</head>
<body>

    <div class="error-toast" id="errorToast" onclick="this.style.display='none'"></div>

    <!-- Всплывающее окно запуска Кинотеатра -->
    <div class="modal-overlay" id="launchModal" style="display: none;">
        <div class="modal-box">
            <h2>Запустить Кинотеатр 🎬</h2>
            <p>Вставьте ссылку на выбранную страницу/серию с Kinovibe:</p>
            <input type="text" id="launchUrlInput" class="pin-input" style="font-size: 14px; letter-spacing: 0;" placeholder="https://kinovibe.cc/...">
            <button class="btn btn-owner" onclick="confirmLaunchCinema()">🚀 СТАРТ ДЛЯ ДВОИХ</button>
            <button class="btn btn-guest" onclick="closeLaunchModal()">Отмена</button>
        </div>
    </div>

    <!-- Всплывающее окно Входа -->
    <div class="modal-overlay" id="authModal">
        <div class="modal-box">
            <h2>Shark Cinema 🦈</h2>
            <p>Введи 8-значный ПИН Овнера или войди как зритель</p>
            <input type="password" id="pinInput" class="pin-input" maxlength="8" placeholder="••••••••" inputmode="numeric">
            <button class="btn btn-owner" id="loginBtn" onclick="loginOwner()">Войти как Owner</button>
            <button class="btn btn-guest" onclick="loginGuest()">Пропустить (Я Зритель)</button>
        </div>
    </div>

    <!-- Плавающая кнопка для Овнера -->
    <button class="floating-btn" id="floatingSyncBtn" onclick="openLaunchModal()">🎬 Запустить в Кинотеатре</button>

    <div class="header">
        <h2>Shark Cinema <small style="font-size: 12px; color: #9d8ec4;">v2.5</small></h2>
        <div class="status-group">
            <span id="serverBadge" class="badge badge-offline">🔴 Подключение...</span>
            <span id="roleBadge" class="badge badge-guest">Режим: Зритель</span>
        </div>
    </div>

    <!-- РЕЖИМ 1: Каталог Киновайба -->
    <div class="view-mode" id="catalogMode">
        <div class="catalog-container">
            <div class="guest-overlay" id="guestOverlay"></div>
            <iframe id="mainIframe" src="https://kinovibe.cc/"></iframe>
        </div>
    </div>

    <!-- РЕЖИМ 2: Чистый Кинотеатр со стартам 5 сек -->
    <div class="view-mode" id="cinemaMode" style="display: none;">
        <div class="cinema-container" id="cinemaBox" style="display: block;">
            <div class="countdown-overlay" id="countdownOverlay">
                <p style="color: #9d8ec4; font-size: 18px; margin-bottom: 10px;">Синхронный старт через:</p>
                <div class="countdown-number" id="countdownNum">5</div>
            </div>
            <video id="cinemaPlayer" controls playsinline></video>
        </div>
        
        <!-- Переключатель серий -->
        <div class="episodes-bar" id="episodesBar">
            <button class="ep-btn active" onclick="switchEpisode(1)">1 Серия</button>
            <button class="ep-btn" onclick="switchEpisode(2)">2 Серия</button>
            <button class="ep-btn" onclick="switchEpisode(3)">3 Серия</button>
            <button class="ep-btn" onclick="switchEpisode(4)">4 Серия</button>
            <button class="ep-btn" onclick="switchEpisode(5)">5 Серия</button>
            <button class="ep-btn" onclick="switchEpisode(6)">6 Серия</button>
            <button class="ep-btn" onclick="switchEpisode(7)">7 Серия</button>
            <button class="ep-btn" onclick="switchEpisode(8)">8 Серия</button>
            <button class="ep-btn" onclick="switchEpisode(9)">9 Серия</button>
            <button class="ep-btn" onclick="switchEpisode(10)">10 Серия</button>
        </div>

        <div class="cinema-tools" id="ownerTools" style="display: none;">
            <button class="btn btn-guest" style="width: auto; padding: 10px 20px;" onclick="exitCinema()">⬅ Вернуться в каталог Киновайба</button>
        </div>
    </div>

    <!-- Консоль логов -->
    <div class="log-console-bar">
        <div class="log-header" onclick="toggleLogs()">
            <span>🐞 Живой Лог Ошибок <span id="logCount">(0)</span></span>
            <span id="toggleText">▲ Показать логи</span>
        </div>
        <div class="log-content" id="logContent"></div>
    </div>

    <script>
        const VERSION = "2.5.0";
        const SERVER_URL = "https://agile-enrich-grumpily.ngrok-free.dev";
        let logCounter = 0;

        function addLog(type, msg, details = '') {
            logCounter++;
            document.getElementById('logCount').innerText = `(${logCounter})`;
            const consoleBox = document.getElementById('logContent');
            const time = new Date().toLocaleTimeString();
            const line = document.createElement('div');
            line.className = `log-line log-${type.toLowerCase()}`;
            line.innerHTML = `<span>[${time}] [${type}]</span> ${msg} <small style="color:#777">${details}</small>`;
            consoleBox.appendChild(line);
            consoleBox.scrollTop = consoleBox.scrollHeight;
            if (type === 'ERROR') { showRawError(`[${type}] ${msg} ${details}`); }
        }

        function showRawError(text) {
            const toast = document.getElementById('errorToast');
            toast.innerText = text; toast.style.display = 'block';
        }

        function toggleLogs() {
            const content = document.getElementById('logContent');
            const toggleText = document.getElementById('toggleText');
            if (content.style.display === 'block') {
                content.style.display = 'none'; toggleText.innerText = '▲ Показать логи';
            } else {
                content.style.display = 'block'; toggleText.innerText = '▼ Скрыть логи';
            }
        }

        const socket = io(SERVER_URL, {
            transports: ['websocket'],
            query: { v: VERSION },
            extraHeaders: { "ngrok-skip-browser-warning": "true" },
            timeout: 5000
        });

        const catalogMode = document.getElementById('catalogMode');
        const cinemaMode = document.getElementById('cinemaMode');
        const cinemaPlayer = document.getElementById('cinemaPlayer');
        const countdownOverlay = document.getElementById('countdownOverlay');
        const countdownNum = document.getElementById('countdownNum');
        
        let isOwner = false;
        let ignoreNextSync = false;

        socket.on('connect', () => {
            addLog('SUCCESS', 'WebSocket ПОДКЛЮЧЕН v2.5!');
            const serverBadge = document.getElementById('serverBadge');
            serverBadge.className = 'badge badge-online';
            serverBadge.innerText = '🟢 На связи (v2.5)';
        });

        socket.on('disconnect', (reason) => {
            addLog('WARN', 'WebSocket отключен:', reason);
            const serverBadge = document.getElementById('serverBadge');
            serverBadge.className = 'badge badge-offline';
            serverBadge.innerText = '🔴 Офлайн';
        });

        socket.on('auth_result', (data) => {
            document.getElementById('loginBtn').innerText = "Войти как Owner";
            document.getElementById('loginBtn').disabled = false;

            if (data.success) {
                isOwner = true;
                addLog('SUCCESS', 'Авторизован как Owner');
                document.getElementById('authModal').style.display = 'none';
                document.getElementById('roleBadge').className = 'badge badge-owner';
                document.getElementById('roleBadge').innerText = 'Режим: Owner 👑';
                document.getElementById('floatingSyncBtn').style.display = 'block'; // Показываем плавающую кнопку
                document.getElementById('ownerTools').style.display = 'flex';
            } else {
                addLog('ERROR', 'Ошибка авторизации!', data.message);
            }
        });

        // Запуск режима Кинотеатра с таймером 5 сек
        socket.on('cinema_start', (data) => {
            addLog('INFO', 'Запуск Режима Кинотеатра для фильма:', data.url);
            catalogMode.style.display = 'none';
            cinemaMode.style.display = 'block';
            cinemaPlayer.src = data.url;
            
            countdownOverlay.style.display = 'flex';
            let count = 5;
            countdownNum.innerText = count;

            let interval = setInterval(() => {
                count--;
                if (count > 0) {
                    countdownNum.innerText = count;
                } else {
                    clearInterval(interval);
                    countdownOverlay.style.display = 'none';
                    cinemaPlayer.play();
                }
            }, 1000);
        });

        socket.on('cinema_exit', () => {
            addLog('INFO', 'Возврат в каталог Киновайба');
            cinemaPlayer.pause();
            cinemaPlayer.src = "";
            cinemaMode.style.display = 'none';
            catalogMode.style.display = 'block';
        });

        socket.on('sync_event', (data) => {
            ignoreNextSync = true;
            if (data.action === 'play') {
                if (Math.abs(cinemaPlayer.currentTime - data.time) > 1) {
                    cinemaPlayer.currentTime = data.time;
                }
                cinemaPlayer.play();
            } else if (data.action === 'pause') {
                cinemaPlayer.currentTime = data.time;
                cinemaPlayer.pause();
            } else if (data.action === 'seek') {
                cinemaPlayer.currentTime = data.time;
            }
            setTimeout(() => { ignoreNextSync = false; }, 300);
        });

        function openLaunchModal() {
            document.getElementById('launchModal').style.display = 'flex';
        }

        function closeLaunchModal() {
            document.getElementById('launchModal').style.display = 'none';
        }

        function confirmLaunchCinema() {
            const url = document.getElementById('launchUrlInput').value.trim();
            if (!url) return alert('Вставь ссылку на выбранный сериал с Kinovibe!');
            closeLaunchModal();
            addLog('INFO', 'Овнер запускает Чистый Кинотеатр:', url);
            socket.emit('sync_action', { action: 'cinema_load', url: url });
        }

        function switchEpisode(epNum) {
            if (!isOwner) return;
            addLog('INFO', 'Переключение на серию №:', epNum);
            // Подсветка активной серии
            document.querySelectorAll('.ep-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            
            // Отправляем сигнал смены серии
            socket.emit('sync_action', { action: 'change_episode', episode: epNum });
        }

        cinemaPlayer.addEventListener('play', () => {
            if (isOwner && !ignoreNextSync) {
                socket.emit('sync_action', { action: 'play', time: cinemaPlayer.currentTime });
            }
        });

        cinemaPlayer.addEventListener('pause', () => {
            if (isOwner && !ignoreNextSync) {
                socket.emit('sync_action', { action: 'pause', time: cinemaPlayer.currentTime });
            }
        });

        cinemaPlayer.addEventListener('seeked', () => {
            if (isOwner && !ignoreNextSync) {
                socket.emit('sync_action', { action: 'seek', time: cinemaPlayer.currentTime });
            }
        });

        function exitCinema() {
            if (isOwner) {
                socket.emit('sync_action', { action: 'exit_cinema' });
            }
        }

        function loginOwner() {
            const pinInput = document.getElementById('pinInput').value.trim();
            if (!pinInput) return alert('Введи 8-значный ПИН!');
            document.getElementById('loginBtn').innerText = "Проверка ПИНа...";
            document.getElementById('loginBtn').disabled = true;
            socket.emit('auth_owner', { pin: pinInput });
        }

        function loginGuest() {
            document.getElementById('authModal').style.display = 'none';
            document.getElementById('roleBadge').className = 'badge badge-guest';
            document.getElementById('roleBadge').innerText = 'Режим: Зритель 👁️';
            document.getElementById('guestOverlay').style.display = 'block';
        }
    </script>
</body>
</html>
