<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shark Cinema 🦈</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: #0b0713; color: #e2dbf8; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 15px; }
        
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(11, 7, 19, 0.9); backdrop-filter: blur(12px); display: flex; justify-content: center; align-items: center; z-index: 1000; }
        .modal-box { background: #171026; border: 1px solid #332252; padding: 30px 25px; border-radius: 24px; text-align: center; width: 90%; max-width: 380px; box-shadow: 0 15px 35px rgba(123, 44, 191, 0.2); }
        .modal-box h2 { margin-bottom: 10px; font-size: 24px; color: #c77dff; }
        .modal-box p { font-size: 14px; color: #9d8ec4; margin-bottom: 22px; }
        .pin-input { width: 100%; padding: 14px; border-radius: 14px; border: 1px solid #3d2b63; background: #0f0a1c; color: #e2dbf8; font-size: 20px; text-align: center; letter-spacing: 6px; margin-bottom: 15px; outline: none; }
        .pin-input:focus { border-color: #9d4edd; box-shadow: 0 0 15px rgba(157, 78, 221, 0.4); }

        .btn { width: 100%; padding: 14px; border-radius: 14px; border: none; font-weight: bold; font-size: 15px; cursor: pointer; transition: 0.2s; }
        .btn-owner { background: linear-gradient(135deg, #7b2cbf, #9d4edd); color: white; margin-bottom: 12px; box-shadow: 0 4px 15px rgba(123, 44, 191, 0.4); }
        .btn-guest { background: transparent; color: #9d8ec4; border: 1px solid #332252; }
        
        .header { width: 100%; max-width: 900px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .header h2 { font-size: 22px; color: #e2dbf8; text-shadow: 0 0 10px rgba(199, 125, 255, 0.3); }
        .badge { padding: 6px 14px; border-radius: 20px; font-size: 12px; font-weight: bold; }
        .badge-owner { background: rgba(157, 78, 221, 0.2); color: #c77dff; border: 1px solid #9d4edd; }
        .badge-guest { background: rgba(114, 9, 183, 0.2); color: #b5179e; border: 1px solid #7209b7; }

        .owner-panel { width: 100%; max-width: 900px; background: #171026; border: 1px solid #332252; padding: 18px; border-radius: 18px; margin-bottom: 20px; display: none; box-shadow: 0 8px 25px rgba(0,0,0,0.3); }
        .url-input-group { display: flex; gap: 10px; }
        .url-input { flex: 1; padding: 12px 16px; border-radius: 12px; border: 1px solid #3d2b63; background: #0f0a1c; color: white; font-size: 14px; outline: none; }

        /* Контейнер интерактивного плеера */
        .player-container { 
            width: 100%; max-width: 900px; height: 500px; 
            position: relative; background: #000; border-radius: 20px; 
            overflow: hidden; border: 1px solid #2e1f47; 
            box-shadow: 0 12px 40px rgba(123, 44, 191, 0.25); 
        }
        iframe { width: 100%; height: 100%; border: none; }
        
        @media (max-width: 600px) {
            .player-container { height: 280px; }
        }
    </style>
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
</head>
<body>

    <div class="modal-overlay" id="authModal">
        <div class="modal-box">
            <h2>Shark Cinema 🦈</h2>
            <p>Введи 8-значный ПИН Овнера или войди как зритель</p>
            <input type="password" id="pinInput" class="pin-input" maxlength="8" placeholder="••••••••" inputmode="numeric">
            <button class="btn btn-owner" onclick="loginOwner()">Войти как Owner</button>
            <button class="btn btn-guest" onclick="loginGuest()">Пропустить (Я Зритель)</button>
        </div>
    </div>

    <div class="header">
        <h2>Shark Cinema</h2>
        <span id="roleBadge" class="badge badge-guest">Режим: Зритель</span>
    </div>

    <div class="owner-panel" id="ownerPanel">
        <div class="url-input-group">
            <input type="text" id="kinovibeUrl" class="url-input" placeholder="Вставь ссылку на фильм с Kinovibe...">
            <button class="btn btn-owner" style="width: auto; padding: 0 22px; margin-bottom: 0;" onclick="loadMovie()">Загрузить</button>
        </div>
    </div>

    <!-- Интерактивный плеер -->
    <div class="player-container">
        <iframe id="mainIframe" src="about:blank" allowfullscreen allow="autoplay; encrypted-media"></iframe>
    </div>

    <script>
        // Вставь сюда твою активную ссылку из консоли VPS:
        const SERVER_URL = "https://0a8ea5b8cfd40a.lhr.life";
        const socket = io(SERVER_URL);
        const iframe = document.getElementById('mainIframe');

        socket.on('connect', () => {
            console.log("Успешное подключение к VPS!");
        });

        socket.on('auth_result', (data) => {
            if (data.success) {
                document.getElementById('authModal').style.display = 'none';
                document.getElementById('ownerPanel').style.display = 'block';
                document.getElementById('roleBadge').className = 'badge badge-owner';
                document.getElementById('roleBadge').innerText = 'Режим: Owner 👑';
            } else {
                alert('Неверный ПИН!');
            }
        });

        socket.on('room_state', (state) => {
            if (state.current_url && iframe.src !== state.current_url) {
                iframe.src = state.current_url;
            }
        });

        socket.on('sync_event', (data) => {
            if (data.action === 'load') {
                console.log("Загружаем плеер страницы:", data.url);
                iframe.src = data.url;
            }
        });

        function loginOwner() {
            const pinInput = document.getElementById('pinInput').value.trim();
            if (!pinInput) return alert('Введи ПИН!');
            socket.emit('auth_owner', { pin: pinInput });
        }

        function loginGuest() {
            document.getElementById('authModal').style.display = 'none';
            document.getElementById('roleBadge').className = 'badge badge-guest';
            document.getElementById('roleBadge').innerText = 'Режим: Зритель 👁️';
        }

        function loadMovie() {
            const url = document.getElementById('kinovibeUrl').value.trim();
            if (!url) return alert('Вставь ссылку!');
            
            iframe.src = url;
            socket.emit('sync_action', { action: 'load', url: url });
        }
    </script>
</body>
</html>
